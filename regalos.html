<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Regalos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--cielo:#BFE3F5;--crema:#FFFBF0;--rosa:#F4A7B9;--amarillo:#FBE58C;--coral:#EE7F80;--texto:#C35F80;--texto-oscuro:#7A3E5B;--verde:#A7D9A3}
*{box-sizing:border-box}
body{margin:0; font-family:'Fredoka', system-ui, sans-serif; color:var(--texto-oscuro); background:repeating-linear-gradient(90deg, var(--cielo) 0 36px, var(--crema) 36px 58px, var(--rosa) 58px 61px, var(--crema) 61px 84px); min-height:100vh}
main{max-width:560px; margin:0 auto; padding:24px 16px 48px}
.bloque{background:var(--amarillo); border:5px solid var(--coral); border-radius:28px; padding:26px 24px; text-align:center}
.titulo{font-family:'Kalam', cursive; font-size:44px; font-weight:700; color:var(--texto); margin:0 0 14px; line-height:1.1}
.regalos{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; text-align:left}
.regalo{background:var(--crema); border:2px dashed var(--rosa); border-radius:14px; padding:10px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.ico{font-size:30px; width:44px; text-align:center; flex-shrink:0}
.nom{flex:1; min-width:0; font-size:17px; font-weight:600; color:var(--texto-oscuro)}
.ver{font-size:14px; font-weight:600; background:var(--verde); color:#1F4D2A; padding:7px 16px; border-radius:999px; text-decoration:none; white-space:nowrap}
.volver{display:inline-block; margin-top:18px; font-size:16px; font-weight:600; color:var(--texto-oscuro); text-decoration:none; background:var(--crema); border-radius:999px; padding:8px 16px}
</style>
</head>
<body>
<main>
<div class="bloque">
<p class="titulo">Lista de Regalos</p>
<ul class="regalos">
<li class="regalo"><span class="ico">🍎</span><span class="nom">Un kilo de fruta</span></li>
<li class="regalo"><span class="ico">💄</span><span class="nom">Maquillaje</span></li>
<li class="regalo"><span class="ico">👜</span><span class="nom">Accesorios</span></li>
<li class="regalo"><span class="ico">🎄</span><span class="nom">Taza de Navidad</span><a class="ver" href="https://www.metro.pe/taza-krea-pinos-navidad-326ml-1060693/p" target="_blank" rel="noopener">Ver</a></li>
<li class="regalo"><span class="ico">🍵</span><span class="nom">Taza</span><a class="ver" href="https://www.metro.pe/tazon-krea-realce-boho-1044517/p" target="_blank" rel="noopener">Ver</a></li>
<li class="regalo"><span class="ico">🕯️</span><span class="nom">Paquete de velas</span><a class="ver" href="https://www.metro.pe/pack-2o-velas-krea-t-light-ecru-1046393/p" target="_blank" rel="noopener">Ver</a></li>
<li class="regalo"><span class="ico">🕯️</span><span class="nom">Vela</span><a class="ver" href="https://www.metro.pe/vela-krea-pilar-7cm-ecru-1046397/p" target="_blank" rel="noopener">Ver</a></li>
</ul>
</div>
<p style="text-align:center"><a class="volver" href="index.html">← Volver a la invitación</a></p>
</main>
</body>
</html>
