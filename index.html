<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación Noemí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--cielo:#BFE3F5;--crema:#FFFBF0;--rosa:#F4A7B9;--amarillo:#FBE58C;--coral:#EE7F80;--texto:#C35F80;--texto-oscuro:#7A3E5B;--verde:#A7D9A3}
*{box-sizing:border-box}
body{margin:0; font-family:'Fredoka', system-ui, sans-serif; color:var(--texto-oscuro); background:repeating-linear-gradient(90deg, var(--cielo) 0 36px, var(--crema) 36px 58px, var(--rosa) 58px 61px, var(--crema) 61px 84px); min-height:100vh}
main{max-width:560px; margin:0 auto; padding:24px 16px 48px}
.sobre-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 48px); gap:18px; text-align:center}
.sobre{position:relative; width:300px; height:200px; background:#F9C6D1; border-radius:6px; box-shadow:0 8px 20px rgba(122,62,91,.2); cursor:pointer; border:none; padding:0}
.sobre::before{content:""; position:absolute; left:0; top:0; width:0; height:0; border-left:150px solid transparent; border-right:150px solid transparent; border-top:110px solid #F4B5C4; transform-origin:top center; transition:transform .6s ease; z-index:2}
.sobre::after{content:""; position:absolute; left:0; bottom:0; width:0; height:0; border-left:150px solid #F9C6D1; border-right:150px solid #F9C6D1; border-bottom:100px solid transparent; z-index:1}
.sello{position:absolute; left:50%; top:90px; transform:translate(-50%,-50%); width:58px; height:58px; border-radius:50%; background:var(--coral); color:#FFFFFF; font-family:'Kalam', cursive; font-size:28px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pista{font-family:'Kalam', cursive; font-size:24px; color:var(--texto)}
.contenido{display:none}
.abierto .sobre-wrap{display:none}
.abierto .contenido{display:block; animation:aparecer .8s ease}
.abierto .sobre::before{transform:rotateX(180deg)}
@keyframes aparecer{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none}}
.tarjeta{background:var(--crema); border-radius:14px; overflow:hidden; box-shadow:0 6px 18px rgba(122,62,91,.15); margin:0 -16px 22px}
.tarjeta img{display:block; width:100%; height:auto; transform:scale(1.06)}
.bloque{background:var(--amarillo); border:5px solid var(--coral); border-radius:28px; padding:26px 24px; margin-bottom:22px; text-align:center}
.titulo{font-family:'Kalam', cursive; font-size:38px; font-weight:700; color:var(--texto); margin:0 0 8px; line-height:1.1}
.texto{font-family:'Kalam', cursive; font-size:22px; font-weight:300; color:var(--texto); margin:6px 0}
.pendiente{display:inline-block; font-size:16px; color:var(--texto-oscuro); background:var(--crema); border:2px dashed var(--rosa); border-radius:10px; padding:8px 12px; margin-top:6px}
input{font-family:'Fredoka', sans-serif; font-size:17px; padding:12px 14px; border:2px dashed var(--rosa); border-radius:12px; background:var(--crema); color:var(--texto-oscuro); width:100%; margin-top:8px}
.boton{display:block; font-family:'Fredoka', sans-serif; font-size:17px; font-weight:600; padding:13px 16px; border:none; border-radius:999px; background:var(--verde); color:#1F4D2A; text-align:center; cursor:pointer; margin-top:12px; width:100%}
.boton:hover{filter:brightness(.95)}
.aviso{font-family:'Kalam', cursive; font-size:20px; color:var(--texto); margin:10px 0 0; min-height:24px}
.fin{font-family:'Kalam', cursive; font-size:34px; font-weight:700; color:var(--texto); text-align:center; margin-top:10px}
</style>
</head>
<body>
<main>

<div class="sobre-wrap" id="portada">
<p class="pista">Tienes una invitación</p>
<button class="sobre" id="abrir" aria-label="Abrir la invitación">
<span class="sello">N</span>
</button>
<p class="pista">Toca el sobre para abrirlo</p>
<img src="gato.png" alt="Gatito con globos" style="display:block; width:200px; height:auto; margin:10px auto 0">
</div>

<div class="contenido" id="contenido">

<div class="tarjeta">
<img src="invitacion.png" alt="Birthday party para celebrar el cumpleaños de Noemí, sábado 12 de diciembre a las 7:30 pm">
</div>

<div class="bloque">
<p class="texto">Apreciamos mucho tu presencia, y queremos que te sientas cómodo y a gusto. Por eso, ayúdanos a armar la música de la fiesta.</p>
<p class="titulo">¿Qué canción no puede faltar?</p>
<input id="cancion" type="text" placeholder="Nombre de la canción">
<input id="artista" type="text" placeholder="Artista">
<button class="boton" onclick="enviarCancion()">Enviar</button>
<p class="aviso" id="aviso"></p>
</div>

<div class="bloque">
<p class="titulo">Lista de Regalos</p>
<span class="pendiente">Regalos</span>
</div>

  
</div>

</main>

<script>
// Pega aquí la dirección /exec que te da Google Apps Script
var URL_HOJA = 'https://script.google.com/macros/s/AKfycbwMfiSHzM4zeDJHtpqZLrB-yvuVkNrOVPCTJatLXB9MvL3635U8fNwc4V5HfMOKqNtc/exec';

document.getElementById('abrir').addEventListener('click', function(){
document.body.classList.add('abierto');
});

function enviarCancion(){
var c = document.getElementById('cancion').value.trim();
var a = document.getElementById('artista').value.trim();
var aviso = document.getElementById('aviso');
if(!c){
aviso.textContent = 'Escribe el nombre de la canción';
return;
}
// Guarda la canción en la hoja de cálculo sin salir de la página
fetch(URL_HOJA, {
method: 'POST',
mode: 'no-cors',
body: JSON.stringify({cancion: c, artista: a})
});
aviso.textContent = '¡Qué buena elección!';
document.getElementById('cancion').value = '';
document.getElementById('artista').value = '';
}
</script>
</body>
</html>
